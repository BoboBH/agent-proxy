[project]
name = "agent-proxy"
version = "0.1.0"
description = "MCP / HTTP egress proxy for the Agent platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.165",
  "uvicorn[standard]>=0.54",
  "httpx>=0.28",
  "sqlalchemy[asyncio]>=2.1",
  "aiomysql>=0.3",
  "redis>=4.2,<5",
  "pyjwt>=2.15",
  "cryptography>=50",
  "prometheus-client>=0.26",
  "jinja2>=3.1",
  "pymysql>=1.2",
  "pydantic-settings>=2.16.3",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.5"]

# ── 服务形态（用户指令 2026-11-27）──────────────────────────────────────────
# 单一 Docker 容器部署、不打包 wheel（不是 module）：无 build-system / setuptools
# 配置——uv 视本项目为虚拟项目，只装依赖、不装包本体；镜像直接 COPY app/ 源码运行。
# 测试经 pytest pythonpath=["."] 直导仓库根的 app/ 与 mocks/。

# 依赖源（国内网络）：声明为项目级默认源，uv.lock 的下载 URL 随之固化，
# 本地 uv sync 与镜像构建同源同速
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
pythonpath = ["."]
