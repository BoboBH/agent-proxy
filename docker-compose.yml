# agent-proxy 部署栈（详见 docs/DEPLOYMENT.md）。
#
# ── 当前形态：复用宿主机 MySQL / Redis（用户本机 8.4 / 3.0.504）──────────────
# agent-proxy 单容器部署；MYSQL_DSN / REDIS_URL 指向宿主机服务
# （容器内 127.0.0.1 不可达，extra_hosts + host.docker.internal 解析到宿主机）。
#
# ── 如需 Docker 内自建 MySQL / Redis（形态 A）─────────────────────────────
# 从 git 历史恢复本文件早前版本（bf4f88f），或在下面追加 mysql/redis 服务块、
# 恢复 depends_on 与 MYSQL_DSN/REDIS_URL 覆盖（DSN 指向 mysql:3306/redis:6379）。
# ────────────────────────────────────────────────────────────────────────────
services:
  agent-proxy:
    build: .
    image: agent-proxy:latest
    container_name: agent-proxy
    ports:
      - "8800:8800"                       # 宿主机端口占用时改左侧（容器内恒 8800）
    env_file:
      - .env                              # MASTER_KEY / EXTERNAL_BASE / TRACE_MODE 等
    environment:
      # EXTERNAL_BASE 从 .env / shell 插值透传（本机演示默认值即可；生产换真实域名）
      EXTERNAL_BASE: ${EXTERNAL_BASE:-http://127.0.0.1:8800}
      # 容器内 127.0.0.1 不可达宿主机——DSN/REDIS 覆盖为 host.docker.internal；
      # 凭据经 compose 自动读取的 .env 插值（MYSQL_ROOT_PASSWORD / REDIS_PASSWORD，
      # 与 .env 的 MYSQL_DSN / REDIS_URL 同源），密码不进本文件（入库）
      MYSQL_DSN: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@host.docker.internal:3306/agent_proxy
      REDIS_URL: redis://host.docker.internal:6379/1   # 本机 Redis 3.0.504 无密码
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - logs:/app/logs                    # 运行/审计/追踪三类滚动日志（保留 7 天）
    # 优雅停机排空 10s（镜像 ENTRYPOINT uvicorn --timeout-graceful-shutdown 10）；
    # compose 默认宽限期同为 10s，边界上 SIGKILL 会掐断排空中的 SSE 流——给 5s 余量
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  logs:
